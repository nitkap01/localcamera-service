# localcamera-service viewer — built ON the Docker host, nothing goes to Docker Hub.
#
# Deploy/update from a machine with this repo:   scripts/deploy.sh
# (copies viewer/ to the host, then `docker compose up -d --build` there).
#
# Recordings: the NAS share //192.168.0.134/BACKUPS/camera feed is mounted on the Proxmox
# host and passed into the Docker host (CT 106) at /mnt/camera-feed — an unprivileged LXC
# can't mount CIFS itself. See docs/RECORDING.md.
#
# Networking: bridge with published ports + WEBRTC_CANDIDATE (the Docker host's LAN IP),
# so phones get WebRTC instead of falling back to MJPEG.
services:
  localcamera-viewer:
    build: .
    image: localcamera-viewer:local
    pull_policy: never              # local image only; never look on Docker Hub
    container_name: camera
    ports:
      - "8080:8080"                 # web UI
      - "1984:1984"                 # go2rtc API / WebRTC signaling
      - "8555:8555"                 # WebRTC media (tcp)
      - "8555:8555/udp"             # WebRTC media (udp)
    environment:
      CAMERA_IP: "192.168.0.143"
      WEBRTC_CANDIDATE: "192.168.0.246:8555"
      DETECTOR: "yolo"              # people-counter engine: cocossd | yolo (switchable in the People tab)
      TZ: "Asia/Kolkata"            # clip and folder names use this time zone
      RECORD_RETENTION_DAYS: "7"    # continuous recording kept for 7 days…
      RECORD_MAX_GB: "80"           # …and never more than 80 GB in total (oldest clips go first)
      RECORD_SEGMENT_SECONDS: "300" # 5-minute clips
      RECORD_MIN_FREE_GB: "20"      # if the share gets fuller than this, oldest clips go first
      RECORD_BUFFER_DIR: "/recordings-buffer"   # local disk fallback while the NAS is down
    env_file: .env                  # ALERT_SMTP_USER / ALERT_SMTP_PASS / ALERT_TO (email alerts) — host only
    volumes:
      - lcs-data:/data                      # people-count history (SQLite)
      - /mnt/camera-feed:/recordings        # continuous recording -> NAS (via Proxmox mount)
      - camera-buffer:/recordings-buffer    # fallback when the NAS is unreachable; moved to the NAS later
    restart: unless-stopped
    stop_grace_period: 20s          # let ffmpeg close the current clip
    healthcheck:                    # unhealthy = no new video for 5 min (the host watchdog acts on it)
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 3m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  camera-buffer:
  lcs-data:
    external: true                  # the existing volume, so people-count history is kept
    name: ${DATA_VOLUME:?set DATA_VOLUME in .env}
