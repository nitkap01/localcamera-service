# localcamera-service viewer — built ON the Docker host, nothing goes to Docker Hub.
#
# Deploy/update from a machine with this repo:   scripts/deploy.sh
# (copies viewer/ to the host, then `docker compose up -d --build` there).
#
# Secrets live in viewer/.env on the host (never in git) — see .env.example:
#   NAS_USER, NAS_PASSWORD   for the recordings share
#
# Host networking: go2rtc sees the host's real LAN IP, so WebRTC works from phones
# without extra settings (Linux Docker hosts only).
services:
  localcamera-viewer:
    build: .
    image: localcamera-viewer:local
    pull_policy: never              # local image only; never look on Docker Hub
    container_name: localcamera-viewer
    network_mode: host
    environment:
      CAMERA_IP: "192.168.0.143"    # the camera's LAN IP
      DETECTOR: "cocossd"           # people-counter engine: cocossd | yolo (switchable in the People tab)
      TZ: "Asia/Kolkata"            # clip and folder names use this time zone
      RECORD_RETENTION_DAYS: "7"    # continuous recording kept for 7 days
      RECORD_SEGMENT_SECONDS: "300" # 5-minute clips
      RECORD_MIN_FREE_GB: "20"      # if the share gets fuller than this, oldest clips go first
    volumes:
      - lcs-data:/data              # people-count history (SQLite)
      - lcs-recordings:/recordings  # continuous recording -> NAS share
    restart: unless-stopped

volumes:
  lcs-data:
    external: true                  # created by the original Portainer stack; reused so history is kept
    name: ${DATA_VOLUME:-lcs-data}
  lcs-recordings:
    driver: local
    driver_opts:
      type: cifs
      device: "//192.168.0.134/BACKUPS/camera feed"
      o: "addr=192.168.0.134,username=${NAS_USER},password=${NAS_PASSWORD},vers=3.0,uid=0,gid=0,file_mode=0664,dir_mode=0775,noserverino"
