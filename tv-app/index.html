<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: gap: file: filesystem: ws: wss:;">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>NKCam</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
  #cam { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
  #panel {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.88), rgba(0,0,0,0));
    padding: 2em 3em 1.5em;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #panel.visible { opacity: 1; }
  .row { display: flex; align-items: center; padding: 0.3em 0; color: #ccc; font-size: 1.6vw; }
  .row .label { width: 8em; flex-shrink: 0; }
  .row .value { font-weight: bold; color: #fff; }
  .row.focused { color: #fff; }
  .row.focused .label::before { content: "\25B8  "; color: #4da3ff; }
  .row:not(.focused) .label::before { content: "    "; }
</style>
</head>
<body>
<img id="cam" src="http://192.168.0.246:8080/stream.mjpeg" alt="Camera feed">
<div id="panel">
  <div class="row" data-key="rot"><span class="label">Rotate</span><span class="value"></span></div>
  <div class="row" data-key="mirror"><span class="label">Mirror</span><span class="value"></span></div>
  <div class="row" data-key="hidelogo"><span class="label">Hide Logo</span><span class="value"></span></div>
  <div class="row" data-key="q"><span class="label">Quality</span><span class="value"></span></div>
  <div class="row" data-key="b"><span class="label">Brightness</span><span class="value"></span></div>
  <div class="row" data-key="c"><span class="label">Contrast</span><span class="value"></span></div>
  <div class="row" data-key="s"><span class="label">Saturation</span><span class="value"></span></div>
  <div class="row" data-key="hue"><span class="label">Hue</span><span class="value"></span></div>
</div>
<script>
(function () {
  var BASE = 'http://192.168.0.246:8080/stream.mjpeg';
  var img = document.getElementById('cam');
  var panel = document.getElementById('panel');
  var rows = Array.prototype.slice.call(document.querySelectorAll('.row'));
  var focusIndex = 0;

  var state = { rot: 0, mirror: 0, hidelogo: 0, q: 'hd', b: 1, c: 1, s: 1, hue: 0 };

  var defs = {
    rot:      { type: 'cycle', values: [0, 90, 180, 270], fmt: function (v) { return v + '°'; } },
    mirror:   { type: 'cycle', values: [0, 1], fmt: function (v) { return v ? 'On' : 'Off'; } },
    hidelogo: { type: 'cycle', values: [0, 1], fmt: function (v) { return v ? 'On' : 'Off'; } },
    q:        { type: 'cycle', values: ['hd', 'sd'], fmt: function (v) { return v.toUpperCase(); } },
    b:        { type: 'range', min: 0.2, max: 2, step: 0.1, fmt: function (v) { return v.toFixed(1); } },
    c:        { type: 'range', min: 0.2, max: 2, step: 0.1, fmt: function (v) { return v.toFixed(1); } },
    s:        { type: 'range', min: 0, max: 3, step: 0.1, fmt: function (v) { return v.toFixed(1); } },
    hue:      { type: 'range', min: -180, max: 180, step: 10, fmt: function (v) { return v + '°'; } }
  };

  function renderRow(row) {
    var key = row.getAttribute('data-key');
    row.querySelector('.value').textContent = defs[key].fmt(state[key]);
  }
  rows.forEach(renderRow);

  function renderFocus() {
    rows.forEach(function (row, i) { row.classList.toggle('focused', i === focusIndex); });
  }
  renderFocus();

  var reloadTimer = null;
  function scheduleReload() {
    clearTimeout(reloadTimer);
    reloadTimer = setTimeout(function () {
      var qs = Object.keys(state).map(function (k) { return k + '=' + encodeURIComponent(state[k]); }).join('&');
      img.src = BASE + '?' + qs;
    }, 400);
  }

  var hideTimer = null;
  function showPanel() {
    panel.classList.add('visible');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { panel.classList.remove('visible'); }, 6000);
  }
  function hidePanel() {
    panel.classList.remove('visible');
    clearTimeout(hideTimer);
  }

  function adjust(key, dir) {
    var def = defs[key];
    if (def.type === 'cycle') {
      var idx = def.values.indexOf(state[key]);
      idx = (idx + dir + def.values.length) % def.values.length;
      state[key] = def.values[idx];
    } else {
      var v = state[key] + dir * def.step;
      v = Math.min(def.max, Math.max(def.min, v));
      state[key] = Math.round(v * 100) / 100;
    }
    renderRow(rows[focusIndex]);
    scheduleReload();
  }

  document.addEventListener('keydown', function (e) {
    var visible = panel.classList.contains('visible');
    var navKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
    if (navKeys.indexOf(e.key) === -1) return;

    if (!visible) {
      showPanel();
      return; // first press just reveals the panel
    }

    showPanel(); // any nav press resets the auto-hide timer
    if (e.key === 'ArrowDown') {
      focusIndex = (focusIndex + 1) % rows.length;
      renderFocus();
    } else if (e.key === 'ArrowUp') {
      focusIndex = (focusIndex - 1 + rows.length) % rows.length;
      renderFocus();
    } else if (e.key === 'ArrowRight') {
      adjust(rows[focusIndex].getAttribute('data-key'), 1);
    } else if (e.key === 'ArrowLeft') {
      adjust(rows[focusIndex].getAttribute('data-key'), -1);
    }
  });

  document.addEventListener('tizenhwkey', function (e) {
    if (e.keyName !== 'back') return;
    if (panel.classList.contains('visible')) {
      hidePanel();
    } else {
      try { tizen.application.getCurrentApplication().exit(); } catch (err) { /* not running under Tizen */ }
    }
  });

  img.addEventListener('error', function () {
    setTimeout(function () { img.src = img.src.split('?')[0] + '?t=' + Date.now(); }, 3000);
  });
})();
</script>
</body>
</html>
