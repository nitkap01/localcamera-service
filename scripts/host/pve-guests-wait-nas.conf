# /etc/systemd/system/pve-guests.service.d/wait-nas-camera.conf  (Proxmox host)
# Start containers only after the NAS mount has been attempted, so the Docker CT (106) sees the
# share at boot. Wants (not Requires): if the NAS is down, guests still start — and the camera
# records to local disk until nas-camera-check.sh reattaches it.
[Unit]
Wants=mnt-nas\x2dcamera\x2dfeed.mount network-online.target
After=mnt-nas\x2dcamera\x2dfeed.mount network-online.target
